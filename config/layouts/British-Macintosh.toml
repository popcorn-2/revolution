name = "UK Macintosh International layout"
author = "egkoppel"

[rules."alpha"]
shift = "uppercase"
caps  = "uppercase"

# --- Keys ---

[[key]]
code = 0
action = "escape"

# Function keys

[[key]]
code = 1
action = "f1"

[[key]]
code = 2
action = "f2"

[[key]]
code = 3
action = "f3"

[[key]]
code = 4
action = "f4"

[[key]]
