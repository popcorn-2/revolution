# Dead keys

[deadkeys.acute]
"a" = "á"
"e" = "é"
"i" = "í"
"o" = "ó"
"u" = "ú"
"A" = "Á"
"E" = "É"
"I" = "Í"
"O" = "Ó"
"U" = "Ú"
fallback = "´"

[deadkeys.grave]
"a" = "à"
"A" = "À"
"e" = "è"
"E" = "È"
"i" = "ì"
"I" = "Ì"
"o" = "ò"
"O" = "Ò"
"u" = "ù"
"U" = "Ù"
fallback = "`"

[deadkeys.circumflex]
"a" = "â"
"A" = "Â"
"e" = "ê"
"E" = "Ê"
"i" = "î"
"I" = "Î"
"o" = "ô"
"O" = "Ô"
"u" = "û"
"U" = "Û"
fallback = "^"

[deadkeys.tilde]
"a" = "ã"
"A" = "Ã"
"n" = "ñ"
"N" = "Ñ"
"o" = "õ"
"O" = "Õ"
fallback = "~"

[deadkeys.umlaut]
"a" = "ä"
"A" = "Ä"
"e" = "ë"
"E" = "Ë"
"i" = "ï"
"I" = "Ï"
"o" = "ö"
"O" = "Ö"
"u" = "ü"
"U" = "Ü"
fallback = "¨"
